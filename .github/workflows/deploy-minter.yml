name: Deploy Minter on push/merge

# Only trigger on PR/push and only for frontend files
on:
  # Trigger on PR close
  pull_request:
    types: [ closed ]
    paths:
      - 'minter/*.json'
      - 'minter/*.js'
      - 'minter/**'
      - '.github/workflows/deploy-minter.yml'
    branches:
      - main
  
  # Trigger on push to master (edge case, local merge)
  push:
    branches:
      - main
    paths:
      - 'minter/*.json'
      - 'minter/*.js'
      - 'minter/**'
      - '.github/workflows/deploy-minter.yml'

jobs:
  # Build the frontend giles
  build:
    name: Compile frontend

    runs-on: ubuntu-latest

    steps:
      # Get the repo files from current commit
      - name: Cloning repository
        uses: actions/checkout@v7

      - name: Set Node.js (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: minter/.nvmrc

      # The lockfile is out of sync with package.json, so install rather than ci
      - name: Install dependencies
        run: npm i
        working-directory: minter

      - name: Build website files
        env:
          NODE_ENV: production
          CI: false
        run: npm run build
        working-directory: minter

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@35d0fd9b92b2c66dcd13f1b72dacc588e89e7567 # v15.32.1
        with:
          args: deploy --only hosting:minter
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_DEPLOYMENT_GCP_KEY }}
